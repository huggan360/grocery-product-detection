#------------------------------------------------------------
# SERVER, STORAGE AND THE SHARED VIDEO PIPELINE
#------------------------------------------------------------
# Paths are relative to this file. Everyone uses ONE server.
host: 127.0.0.1  # Use --host 0.0.0.0 on the Pi to open it from a laptop.
port: 9000
storage: ../data/acquisition  # Reviewer names and categories; clips are in videos/ here.
# Models, zones, cameras and upload limits: the same file production uses.
video_config: ../configs/video.yaml
# Labels for review and training exports. Adding a label does not train ViT.
# Keep the installed dataset's category names so its images can be reused.
