#------------------------------------------------------------
# ONE ENTRY PER SHELF CAMERA: ADD OR REMOVE AS NEEDED
#------------------------------------------------------------
# USB: kind: opencv, source: 0 (the camera index on the SERVER).
# Network stream: kind: opencv, source: rtsp://camera-address/stream
# Snapshot endpoint: kind: snapshot, source: http://camera-address/snapshot.jpg
# Enable a camera only after setting its actual source. No hardware is needed
# to start the app: Upload images works immediately.
cameras:
  - id: shelf-1
    name: Top shelf
    enabled: false
    kind: opencv
    source: 0
  - id: shelf-2
    name: Middle shelf
    enabled: false
    kind: opencv
    source: 1
  - id: shelf-3
    name: Bottom shelf
    enabled: false
    kind: opencv
    source: 2
