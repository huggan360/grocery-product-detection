#------------------------------------------------------------
# SERVER AND SHARED STORAGE
#------------------------------------------------------------
# Paths are relative to this file. Everyone uses ONE server and this database.
host: 127.0.0.1
port: 9000
storage: ../data/fridge_annotations
lease_seconds: 90
max_upload_mb: 20
max_image_pixels: 24000000

#------------------------------------------------------------
# MODEL SUGGESTIONS
#------------------------------------------------------------
# Segment the full shelf first. The optional grocery ViT then labels masked crops.
model_config: ../configs/inference.yaml
suggestions: true
# All model weights, thresholds and preprocessing live in model_config.
# Labels for review and training exports. Adding a label does not train ViT.
# Keep the installed dataset's category names so its images can be reused.
categories:
